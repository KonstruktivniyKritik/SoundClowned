services:
  # ---------------------------------------------
  # 1. PostgreSQL Service (NEW)
  # ---------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: soundclowned_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: soundclowned_user
      POSTGRES_PASSWORD: my_strong_password
      POSTGRES_DB: identity_db # База данных для Identity Provider
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundclowned_user -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # 2. MongoDB Service (UNCHANGED)
  # ---------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: soundclowned_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # ---------------------------------------------
  # 3. Zookeeper (Required for Kafka)
  # ---------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: soundclowned_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ---------------------------------------------
  # 4. Kafka Broker
  # ---------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: soundclowned_kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "29092:29092" # EXTERNAL порт для локальных инструментов
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Настройки слушателей: INTERNAL для контейнеров, EXTERNAL для хоста
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


  # ---------------------------------------------
  # 5. Identity Provider Service 
  # ---------------------------------------------
  identity:
    build:
      context: ./server/Identity Provider
      dockerfile: Dockerfile
    container_name: soundclowned_identity_provider
    restart: unless-stopped
    ports:
      - "8081:8080" 
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgresDb: "Host=postgres;Port=5432;Database=identity_db;Username=soundclowned_user;Password=my_strong_password"
      JwtSettings__Secret: "ThisIsAVeryStrongAndLongSecretKeyForJWTAuthToken"
      JwtSettings__Issuer: "SoundclownedIdentity"
      JwtSettings__Audience: "SoundclownedApi"
      KafkaSettings__BrokerList: "kafka:9092"
      
  # ---------------------------------------------
  # 6. API Gateway Service
  # ---------------------------------------------
  gateway:
    build:
      context: ./server/ApiGateway
      dockerfile: Dockerfile
    container_name: soundclowned_api_gateway
    restart: unless-stopped
    ports:
      - "8082:8080" 
    depends_on:
      identity:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JwtSettings__Secret: "ThisIsAVeryStrongAndLongSecretKeyForJWTAuthToken"
      JwtSettings__Issuer: "SoundclownedIdentity"
      JwtSettings__Audience: "SoundclownedApi"
      
  # ---------------------------------------------
  # 7. Client Service (React Frontend)
  # ---------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: soundclowned_client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      REACT_APP_ARTISTS_API_URL: http://localhost:8080
      REACT_APP_IDENTITY_API_URL: http://localhost:8081
      
volumes:
  mongodb_data:
  postgres_data: # Добавлен новый том для Postgres
