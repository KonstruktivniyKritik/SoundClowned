services:
  # ---------------------------------------------
  # 1. PostgreSQL Service (NEW)
  # ---------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: soundclowned_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: soundclowned_user
      POSTGRES_PASSWORD: my_strong_password
      POSTGRES_DB: identity_db # База данных для Identity Provider
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundclowned_user -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # 2. MongoDB Service (UNCHANGED)
  # ---------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: soundclowned_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # ---------------------------------------------
  # 3. Identity Provider Service 
  # ---------------------------------------------
  identity:
    build:
      context: ./server/Identity Provider
      dockerfile: Dockerfile
    container_name: soundclowned_identity_provider
    restart: unless-stopped
    ports:
      - "8081:8080" 
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Строка подключения для Identity Provider
      ConnectionStrings__PostgresDb: "Host=postgres;Port=5432;Database=identity_db;Username=soundclowned_user;Password=my_strong_password"
      # JWT Настройки (очень важно для безопасности!)
      JwtSettings__Secret: "ThisIsAVeryStrongAndLongSecretKeyForJWTAuthToken"
      JwtSettings__Issuer: "SoundclownedIdentity"
      JwtSettings__Audience: "SoundclownedApi"
      
  # ---------------------------------------------
  # 4. API Gateway Service (UNCHANGED)
  # ---------------------------------------------
  gateway:
    build:
      context: ./server/ApiGateway
      dockerfile: Dockerfile
    container_name: soundclowned_api_gateway
    restart: unless-stopped
    ports:
      - "8082:8080" 
    depends_on:
      identity:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # JWT Настройки (очень важно для безопасности!)
      JwtSettings__Secret: "ThisIsAVeryStrongAndLongSecretKeyForJWTAuthToken"
      JwtSettings__Issuer: "SoundclownedIdentity"
      JwtSettings__Audience: "SoundclownedApi"
      
  # ---------------------------------------------
  # 5. Client Service (React Frontend)
  # ---------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: soundclowned_client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      REACT_APP_ARTISTS_API_URL: http://localhost:8080
      REACT_APP_IDENTITY_API_URL: http://localhost:8081
      
# Определение томов для персистентности данных
volumes:
  mongodb_data:
  postgres_data: # Добавлен новый том для Postgres
